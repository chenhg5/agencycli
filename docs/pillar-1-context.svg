  <text x="300" y="40" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="600">pm</text>
  <text x="390" y="40" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#34d399" text-anchor="middle" font-weight="600">qa</text>
  <text x="480" y="40" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#f97316" text-anchor="middle" font-weight="600">writer</text>
  <!-- header rule -->
  <line x1="22" y1="49" x2="516" y2="49" stroke="#30363d" stroke-width="1"/>
  <!-- vertical col separators -->
  <line x1="160" y1="49" x2="160" y2="175" stroke="#21262d" stroke-width="1"/>
  <line x1="252" y1="49" x2="252" y2="175" stroke="#21262d" stroke-width="1"/>
  <line x1="344" y1="49" x2="344" y2="175" stroke="#21262d" stroke-width="1"/>
  <line x1="436" y1="49" x2="436" y2="175" stroke="#21262d" stroke-width="1"/>
  <!-- row labels -->
  <text x="28" y="83" font-family="'SF Mono',Menlo,monospace" font-size="11" fill="#8b949e">api-service</text>
  <text x="28" y="119" font-family="'SF Mono',Menlo,monospace" font-size="11" fill="#8b949e">mobile-app</text>
  <text x="28" y="155" font-family="'SF Mono',Menlo,monospace" font-size="11" fill="#8b949e">data-pipeline</text>
  <!-- row rules -->
  <line x1="22" y1="97" x2="516" y2="97" stroke="#21262d" stroke-width="1"/>
  <line x1="22" y1="133" x2="516" y2="133" stroke="#21262d" stroke-width="1"/>
  <line x1="22" y1="169" x2="516" y2="169" stroke="#21262d" stroke-width="1"/>

  <!-- api-service: engineer + pm assigned -->
  <circle cx="210" cy="79" r="9" fill="#a78bfa" opacity="0.85"/>
  <circle cx="300" cy="79" r="9" fill="#60a5fa" opacity="0.85"/>
  <circle cx="390" cy="79" r="8" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="480" cy="79" r="8" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- mobile-app: engineer + writer assigned -->
  <circle cx="210" cy="115" r="9" fill="#a78bfa" opacity="0.85"/>
  <circle cx="300" cy="115" r="8" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="390" cy="115" r="8" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="480" cy="115" r="9" fill="#f97316" opacity="0.85"/>

