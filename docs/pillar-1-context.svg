<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="210" viewBox="0 0 900 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="210" fill="#0d1117" rx="10"/>
  <rect x="0.5" y="0.5" width="899" height="209" fill="none" stroke="#30363d" stroke-width="1" rx="10"/>
  <rect x="0" y="0" width="4" height="210" fill="#a78bfa" rx="2"/>

  <!-- ======= MATRIX (left) ======= -->
