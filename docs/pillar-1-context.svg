  <line x1="542" y1="20" x2="542" y2="190" stroke="#21262d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ======= MERGE CHAIN (right) ======= -->
  <text x="560" y="38" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#8b949e">context merged at hire time</text>

  <!-- box 1: agency -->
  <rect x="560" y="46" width="148" height="24" fill="#1a1f2e" stroke="#a78bfa" stroke-width="1" rx="4"/>
  <text x="634" y="62" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#a78bfa" text-anchor="middle">agency-prompt.md</text>
  <line x1="634" y1="70" x2="634" y2="80" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="629,78 634,86 639,78" fill="#4b5563"/>

  <!-- box 2: team -->
  <rect x="560" y="86" width="148" height="24" fill="#1a1f2e" stroke="#60a5fa" stroke-width="1" rx="4"/>
  <text x="634" y="102" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#60a5fa" text-anchor="middle">team/prompt.md</text>
  <line x1="634" y1="110" x2="634" y2="120" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="629,118 634,126 639,118" fill="#4b5563"/>

  <!-- box 3: role -->
  <rect x="560" y="126" width="148" height="24" fill="#1a1f2e" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="634" y="142" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#34d399" text-anchor="middle">role/prompt.md</text>
  <line x1="634" y1="150" x2="634" y2="160" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="629,158 634,166 639,158" fill="#4b5563"/>

  <!-- box 4: project -->
  <rect x="560" y="166" width="148" height="24" fill="#1a1f2e" stroke="#f97316" stroke-width="1" rx="4"/>
  <text x="634" y="182" font-family="'SF Mono',Menlo,monospace" font-size="10" fill="#f97316" text-anchor="middle">project/prompt.md</text>

  <!-- right note -->
  <text x="730" y="90" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#8b949e">update a role prompt once</text>
  <text x="730" y="108" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#8b949e">&#x2192; every agent with that</text>
  <text x="730" y="126" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#8b949e">role gets it on the</text>
  <text x="730" y="144" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#c9d1d9">next sync</text>
