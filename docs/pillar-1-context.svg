  <circle cx="210" cy="151" r="9" fill="#a78bfa" opacity="0.85"/>
  <circle cx="300" cy="151" r="9" fill="#60a5fa" opacity="0.85"/>
  <circle cx="390" cy="151" r="9" fill="#34d399" opacity="0.85"/>
