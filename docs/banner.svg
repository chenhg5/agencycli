  </text>

  <!-- Divider line between left text and right terminal -->
  <line x1="516" y1="30" x2="516" y2="170" stroke="#21262d" stroke-width="1"/>

  <!-- Right side: fake terminal output -->
  <!-- Terminal header dots -->
  <circle cx="546" cy="44" r="5" fill="#ff5f57"/>
  <circle cx="566" cy="44" r="5" fill="#febc2e"/>
  <circle cx="586" cy="44" r="5" fill="#28c840"/>
  <text x="856" y="49" text-anchor="end"
