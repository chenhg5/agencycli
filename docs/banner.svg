  </text>
  <text x="536" y="134" font-family="'SF Mono','Fira Code',monospace" font-size="12">
    <tspan fill="#484f58">[heartbeat]  </tspan><tspan fill="#d29922">  qa      </tspan><tspan fill="#8b949e">1 confirm-request pending</tspan>
  </text>
  <text x="536" y="152" font-family="'SF Mono','Fira Code',monospace" font-size="12">
    <tspan fill="#484f58">[inbox]      </tspan><tspan fill="#a78bfa">	 3 unread</tspan><tspan fill="#8b949e"> from pm · dev · qa</tspan>
  </text>

  <!-- Cursor blink line -->
  <text x="536" y="170" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#6e7681">$ <tspan fill="#58a6ff">ˆ</tspan></text>
