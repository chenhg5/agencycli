  <!-- Vertical accent bar -->
  <rect x="48" y="46" width="4" height="108" fill="url(#accentBar)" rx="2"/>

  <!-- agencycli title -->
  <text x="68" y="117"
    font-family="'SF Mono','JetBrains Mono','Fira Code',Consolas,monospace"
    font-size="64" font-weight="700" letter-spacing="-2"
    fill="url(#titleGrad)">agencycli</text>

  <!-- Subtitle -->
  <text x="70" y="148"
