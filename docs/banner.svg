  <!-- Terminal content -->
  <text x="536" y="76" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#6e7681">$ agencycli scheduler start</text>

  <text x="536" y="98"  font-family="'SF Mono','Fira Code',monospace" font-size="12">
